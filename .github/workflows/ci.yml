name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  spring-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test
        working-directory: evida-core/services/saksrom-api
        run: bash ./mvnw test

  web-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        working-directory: apps/web
        run: npm ci
      - name: Dependency audit
        working-directory: apps/web
        run: npm audit --audit-level=high
      - name: Lint
        working-directory: apps/web
        run: npm run lint
      - name: Test
        working-directory: apps/web
        run: npm run test
      - name: Build
        working-directory: apps/web
        run: npm run build

  pilot-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run test:pilot

  production-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate production compose
        working-directory: deploy/pilot
        run: docker compose --env-file .env.production.example config --quiet
      - name: Build production images
        working-directory: deploy/pilot
        run: docker compose --env-file .env.production.example build web api

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
